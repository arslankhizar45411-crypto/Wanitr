name: CollabAgent APK

on:
  push:
    paths:
      - 'collabcode/**'
      - '.github/workflows/collabagent-apk.yml'
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash tests/run-core-tests.sh

  build:
    needs: core-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: collabagent-debug
          path: collabcode/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
