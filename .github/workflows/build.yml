name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Proot Binaries
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        # Fetching prebuilt proot binaries for arm64-v8a
        curl -L -o app/src/main/jniLibs/arm64-v8a/libproot.so https://raw.githubusercontent.com/termux/proot-distro/master/app/src/main/jniLibs/arm64-v8a/libproot.so || true
        # Alternatively, if you have a script or reliable source, let's create dummy/placeholder or download if available
        # Checking scripts directory if fetch-proot.sh exists
        if [ -f "scripts/fetch-proot.sh" ]; then
          chmod +x scripts/fetch-proot.sh
          ./scripts/fetch-proot.sh || true
        fi

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: wani-terminal-debug
        path: app/build/outputs/apk/debug/app-debug.apk
